<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger Web App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        /* Netlify badge hidden */
        a[href*="netlify.com"], .netlify-badge {
            display: none !important;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans flex flex-col h-full">

    <!-- Auth Container (Login / Register) -->
    <div id="authContainer" class="flex items-center justify-center h-full w-full">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-96 border border-gray-100 m-4">
            <div class="text-center mb-6">
                <i class="fa-brands fa-facebook-messenger text-blue-600 text-5xl mb-2"></i>
                <h2 class="text-2xl font-bold text-gray-800" id="authTitle">লগইন করুন</h2>
                <p class="text-sm text-gray-500">শুধু নাম ও পাসওয়ার্ড দিন</p>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">আপনার নাম (ID Name)</label>
                    <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="যেমন: Monour">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="******">
                </div>
                <button type="submit" id="authBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">
                    লগইন
                </button>
            </form>

            <div class="text-center mt-4">
                <button type="button" onclick="toggleAuthMode()" id="toggleBtn" class="text-sm text-blue-600 hover:underline">
                    অ্যাকাউন্ট নেই? নতুন আইডি খুলুন
                </button>
            </div>
        </div>
    </div>

    <!-- Main Chat App Container -->
    <div id="appContainer" class="hidden flex-1 flex h-full max-w-7xl w-full mx-auto bg-white shadow-2xl overflow-hidden md:my-2 md:h-[calc(100vh-1rem)] md:rounded-lg relative">
        
        <!-- Sidebar (Users List) -->
        <div id="sidebarSection" class="w-full md:w-1/3 border-r border-gray-200 flex flex-col bg-white h-full">
            <!-- User Header -->
            <div class="p-4 border-b flex items-center justify-between bg-gray-50 flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-lg" id="currentAvatar">U</div>
                    <div>
                        <h3 class="font-bold text-gray-800 leading-none text-sm md:text-base" id="currentUserName">User Name</h3>
                        <span class="text-xs text-green-500 font-medium">● অনলাইন</span>
                    </div>
                </div>
                <button onclick="logout()" class="text-gray-500 hover:text-red-500 transition p-2" title="লগআউট">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>
            </div>

            <!-- Contact List Title -->
            <div class="px-4 py-2 bg-gray-100 text-xs font-bold text-gray-500 uppercase tracking-wider flex-shrink-0">
                সব ইউজার আইডি (সবার তালিকা)
            </div>

            <!-- Users List -->
            <div id="usersList" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                <!-- Dynamic users will load here -->
            </div>
        </div>

        <!-- Chat Area (Chat Page) -->
        <div id="chatSection" class="w-full md:w-2/3 flex-col bg-gray-50 h-full hidden md:flex absolute md:relative inset-0 z-20">
            <!-- Active Chat Header -->
            <div class="p-3 md:p-4 border-b bg-white flex items-center justify-between shadow-sm flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <button onclick="backToSidebar()" class="md:hidden text-gray-600 hover:text-blue-600 mr-1 text-lg p-2">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div class="w-10 h-10 rounded-full bg-gray-400 text-white flex items-center justify-center font-bold text-lg" id="activeAvatar">?</div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-sm md:text-base" id="activeUserName">একটি চ্যাট নির্বাচন করুন</h3>
                        <p class="text-xs text-gray-400" id="activeUserStatus">মেসেজ পাঠাতে বাম পাশ থেকে ইউজারে ক্লিক করুন</p>
                    </div>
                </div>
            </div>

            <!-- Messages Window -->
            <div id="messagesContainer" class="flex-1 p-4 overflow-y-auto space-y-3 pb-24">
                <div class="text-center text-gray-400 mt-20">
                    <i class="fa-regular fa-comments text-5xl mb-2"></i>
                    <p>যেকোনো আইডিতে ক্লিক করে চ্যাট শুরু করুন!</p>
                </div>
            </div>

            <!-- Input Bar (Fixed properly at the bottom) -->
            <div class="absolute bottom-0 left-0 right-0 bg-white border-t p-3 flex items-center space-x-2 shadow-lg z-30">
                <label class="cursor-pointer text-blue-600 hover:text-blue-800 p-2">
                    <i class="fa-solid fa-paperclip text-xl"></i>
                    <input type="file" id="fileInput" accept="image/*,video/*" class="hidden" onchange="handleFileSelect(event)">
                </label>

                <button type="button" id="recordBtn" onclick="toggleRecording()" class="text-red-500 hover:text-red-700 p-2">
                    <i class="fa-solid fa-microphone text-xl" id="micIcon"></i>
                </button>

                <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." class="flex-1 border rounded-full px-4 py-2.5 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-100" onkeypress="if(event.key === 'Enter') sendMessage()">

                <button type="button" onclick="sendMessage()" class="bg-blue-600 text-white p-2 rounded-full w-10 h-10 flex items-center justify-center hover:bg-blue-700 transition flex-shrink-0 shadow-md">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, getDocs, addDoc, updateDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUVJTbr52L1-Rp75uyBLWuZyqXDcNB1P8",
            authDomain: "chat-8672c.firebaseapp.com",
            databaseURL: "https://chat-8672c-default-rtdb.firebaseio.com",
            projectId: "chat-8672c",
            storageBucket: "chat-8672c.firebasestorage.app",
            messagingSenderId: "875149198457",
            appId: "1:875149198457:web:a4db2ed6bd14873161c0a8",
            measurementId: "G-F6F2JFC7DL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedUserId = null;
        let selectedUserName = null;
        let isSignUp = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let unsubscribeMessages = null;

        const ADMIN_USERNAME = "monour";

        const formatEmail = (username) => {
            const cleanName = username.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            return `${cleanName}@chat-8672c.internal`;
        };

        window.toggleAuthMode = () => {
            isSignUp = !isSignUp;
            document.getElementById('authTitle').innerText = isSignUp ? "রেজিস্ট্রেশন করুন" : "লগইন করুন";
            document.getElementById('authBtn').innerText = isSignUp ? "সাইন আপ" : "লগইন";
            document.getElementById('toggleBtn').innerText = isSignUp ? "ইতিমধ্যে আইডি আছে? লগইন করুন" : "অ্যাকাউন্ট নেই? নতুন আইডি খুলুন";
        };

        window.handleAuth = async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const email = formatEmail(usernameInput);

            try {
                if (isSignUp) {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(res.user, { displayName: usernameInput });
                    await setDoc(doc(db, "users", res.user.uid), {
                        uid: res.user.uid,
                        username: usernameInput,
                        createdAt: serverTimestamp()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    const user = auth.currentUser;
                    if(user) {
                        await setDoc(doc(db, "users", user.uid), {
                            uid: user.uid,
                            username: user.displayName || usernameInput,
                            createdAt: serverTimestamp()
                        }, { merge: true });
                    }
                }
            } catch (err) {
                alert("লগইন বা রেজিস্ট্রেশনে সমস্যা হয়েছে: " + err.message);
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('currentUserName').innerText = user.displayName || 'ইউজার';
                document.getElementById('currentAvatar').innerText = (user.displayName || 'U')[0].toUpperCase();
                loadUsersRealtime();
            } else {
                currentUser = null;
                document.getElementById('authContainer').classList.remove('hidden');
                document.getElementById('appContainer').classList.add('hidden');
            }
        });

        function loadUsersRealtime() {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const usersList = document.getElementById('usersList');
                usersList.innerHTML = '';

                const isAdmin = currentUser.displayName && currentUser.displayName.toLowerCase() === ADMIN_USERNAME.toLowerCase();

                snapshot.forEach((docSnap) => {
                    const uData = docSnap.data();
                    if (uData.uid !== currentUser.uid) {
                        const div = document.createElement('div');
                        div.className = "p-3 hover:bg-blue-50 cursor-pointer flex items-center justify-between border-b border-gray-50";
                        
                        const infoDiv = document.createElement('div');
                        infoDiv.className = "flex items-center space-x-3 flex-1 overflow-hidden";
                        infoDiv.onclick = () => selectUser(uData.uid, uData.username);
                        infoDiv.innerHTML = `
                            <div class="w-10 h-10 rounded-full bg-gray-300 text-gray-700 font-bold flex items-center justify-center flex-shrink-0">
                                ${(uData.username || 'U')[0].toUpperCase()}
                            </div>
                            <div class="overflow-hidden">
                                <h4 class="font-semibold text-gray-800 text-sm truncate">${uData.username}</h4>
                                <p class="text-xs text-green-500">অনলাইন</p>
                            </div>
                        `;
                        div.appendChild(infoDiv);

                        if (isAdmin) {
                            const deleteBtn = document.createElement('button');
                            deleteBtn.className = "text-red-500 hover:text-red-700 p-2 transition ml-2";
                            deleteBtn.title = "এই আইডি ডিলিট করুন";
                            deleteBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                            deleteBtn.onclick = (e) => {
                                e.stopPropagation();
                                deleteUserAccount(uData.uid, uData.username);
                            };
                            div.appendChild(deleteBtn);
                        }

                        usersList.appendChild(div);
                    }
                });
            });
        }

        window.deleteUserAccount = async (uid, username) => {
            if (confirm(`আপনি কি সত্যি '${username}' আইডিটি চিরতরে ডিলিট করতে চান?`)) {
                try {
                    await deleteDoc(doc(db, "users", uid));
                    alert("আইডি সফলভাবে ডিলিট করা হয়েছে!");
                    if (selectedUserId === uid) {
                        selectedUserId = null;
                        document.getElementById('messagesContainer').innerHTML = `<div class="text-center text-gray-400 mt-20"><p>এই আইডিটি ডিলিট করা হয়েছে।</p></div>`;
                        document.getElementById('activeUserName').innerText = "একটি চ্যাট নির্বাচন করুন";
                        document.getElementById('activeAvatar').innerText = "?";
                    }
                } catch (err) {
                    alert("ডিলিট করতে সমস্যা হয়েছে: " + err.message);
                }
            }
        };

        window.selectUser = (uid, username) => {
            selectedUserId = uid;
            selectedUserName = username;
            document.getElementById('activeUserName').innerText = username;
            document.getElementById('activeAvatar').innerText = username[0].toUpperCase();
            document.getElementById('activeUserStatus').innerText = "অনলাইন";
            
            const chatSection = document.getElementById('chatSection');
            chatSection.classList.remove('hidden');
            chatSection.style.display = 'flex';

            listenMessages();
        };

        window.backToSidebar = () => {
            const chatSection = document.getElementById('chatSection');
            chatSection.classList.add('hidden');
            chatSection.style.display = 'none';
        };

        function listenMessages() {
            if (unsubscribeMessages) unsubscribeMessages();
            if (!selectedUserId) return;

            const chatId = currentUser.uid < selectedUserId 
                ? `${currentUser.uid}_${selectedUserId}` 
                : `${selectedUserId}_${currentUser.uid}`;

            const q = query(
                collection(db, "chats", chatId, "messages"),
                orderBy("createdAt", "asc")
            );

            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('messagesContainer');
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = `<div class="text-center text-gray-400 mt-20"><p>এই চ্যাটে এখনও কোনো মেসেজ নেই। হ্যালো বলুন!</p></div>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = msg.senderId === currentUser.uid;

                    if (!isMe && !msg.seen) {
                        updateDoc(doc(db, "chats", chatId, "messages", docSnap.id), {
                            seen: true
                        });
                    }

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;

                    let content = `<p class="text-sm break-words">${msg.text || ''}</p>`;
                    if (msg.mediaUrl) {
                        if (msg.mediaType === 'image') {
                            content += `<img src="${msg.mediaUrl}" class="max-w-xs rounded-lg mt-1 shadow-sm" />`;
                        } else if (msg.mediaType === 'video') {
                            content += `<video src="${msg.mediaUrl}" controls class="max-w-xs rounded-lg mt-1"></video>`;
                        } else if (msg.mediaType === 'audio') {
                            content += `<audio src="${msg.mediaUrl}" controls class="mt-1"></audio>`;
                        }
                    }

                    let statusHtml = '';
                    if (isMe) {
                        statusHtml = msg.seen 
                            ? `<span class="text-[10px] text-blue-500 font-semibold mt-1">✓✓ Seen</span>`
                            : `<span class="text-[10px] text-gray-400 mt-1">✓ Sent</span>`;
                    }

                    msgDiv.innerHTML = `
                        <div class="max-w-xs md:max-w-md px-4 py-2 rounded-2xl ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-200 text-gray-800 rounded-bl-none'}">
                            ${content}
                        </div>
                        ${statusHtml}
                    `;
                    container.appendChild(msgDiv);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        window.sendMessage = async (mediaUrl = null, mediaType = null) => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !mediaUrl) return;
            if (!selectedUserId) return alert("মেসেজ পাঠাতে বাম পাশ থেকে যেকোনো একটি আইডি সিলেক্ট করুন!");

            const chatId = currentUser.uid < selectedUserId 
                ? `${currentUser.uid}_${selectedUserId}` 
                : `${selectedUserId}_${currentUser.uid}`;

            await addDoc(collection(db, "chats", chatId, "messages"), {
                senderId: currentUser.uid,
                receiverId: selectedUserId,
                text: text,
                mediaUrl: mediaUrl,
                mediaType: mediaType,
                seen: false,
                createdAt: serverTimestamp()
            });

            input.value = '';
        };

        window.handleFileSelect = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const type = file.type.startsWith('image') ? 'image' : 'video';
                sendMessage(evt.target.result, type);
            };
            reader.readAsDataURL(file);
        };

        window.toggleRecording = async () => {
            const micIcon = document.getElementById('micIcon');
            if (!isRecording) {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.onload = (evt) => sendMessage(evt.target.result, 'audio');
                    reader.readAsDataURL(blob);
                };

                mediaRecorder.start();
                isRecording = true;
                micIcon.className = "fa-solid fa-square text-xl animate-pulse";
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micIcon.className = "fa-solid fa-microphone text-xl";
            }
        };
    </script>
</body>
</html>
